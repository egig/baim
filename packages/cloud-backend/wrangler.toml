name = "sabi-cloud"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sabi-db"
database_id = ""

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "sabi-images"

[[queues.producers]]
binding = "QUEUE"
queue = "sabi-jobs"

[[queues.consumers]]
queue = "sabi-jobs"
max_batch_size = 10
max_retries = 5

[triggers]
crons = ["*/30 * * * *"]
